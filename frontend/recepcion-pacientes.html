<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes | Recepción - Hogar Médico del Valle</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.4.0/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/recepcion.css">
</head>
<body>
    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div class="logo-container">
            <img src="img/logo.png" alt="Hogar Médico del Valle" class="logo">
            <div class="logo-text">
                <strong>Hogar Médico</strong>
                del Valle
            </div>
        </div>
        <nav class="nav-menu">
            <a href="recepcion-dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="recepcion-citas.html" class="nav-item">
                <i class="fas fa-calendar-check"></i>
                <span>Citas</span>
            </a>
            <a href="recepcion-pacientes.html" class="nav-item active">
                <i class="fas fa-users"></i>
                <span>Pacientes</span>
            </a>
        </nav>
        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-details">
                <span class="user-name" id="userName">Recepcionista</span>
                <span class="user-role">Recepcionista</span>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <header class="header">
            <h1 class="page-title">
                <i class="fas fa-users"></i>
                Gestión de Pacientes
            </h1>
            <div class="header-actions">
                <div class="date-display">
                    <i class="far fa-calendar-alt"></i>
                    <span id="fechaActual"></span>
                </div>
                <button class="btn-primary" id="nuevoPacienteBtn">
                    <i class="fas fa-plus"></i> Nuevo Paciente
                </button>
            </div>
        </header>

        <!-- TABLA DE PACIENTES -->
        <div class="section-card">
            <div class="section-header">
                <h3><i class="fas fa-list"></i> Listado de Pacientes</h3>
                <span id="totalPacientesTabla">0 pacientes</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Documento</th>
                            <th>Nombre Completo</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="pacientesBody">
                        <tr><td colspan="5" class="loading-msg"><i class="fas fa-spinner fa-spin"></i> Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL NUEVO PACIENTE -->
    <div class="modal" id="modalNuevoPaciente" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> Nuevo Paciente</h3>
                <button class="modal-close" id="cerrarModalPaciente">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formNuevoPaciente">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo de documento</label>
                            <select id="tipoDocumento" required>
                                <option value="CC">Cédula de Ciudadanía (CC)</option>
                                <option value="TI">Tarjeta de Identidad (TI)</option>
                                <option value="CE">Cédula de Extranjería (CE)</option>
                                <option value="PS">Pasaporte (PS)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Número de documento</label>
                            <input type="text" id="documentoPaciente" placeholder="Ej: 1234567890" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombres</label>
                            <input type="text" id="nombresPaciente" placeholder="Nombres completos" required>
                        </div>
                        <div class="form-group">
                            <label>Apellidos</label>
                            <input type="text" id="apellidosPaciente" placeholder="Apellidos completos" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="telefonoPaciente" placeholder="Ej: 3101234567" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="emailPaciente" placeholder="correo@ejemplo.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha de nacimiento</label>
                            <input type="date" id="fechaNacimientoPaciente">
                        </div>
                        <div class="form-group">
                            <label>Género</label>
                            <select id="generoPaciente">
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Otro</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="direccionPaciente" placeholder="Dirección de residencia">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelarModalPaciente">Cancelar</button>
                <button class="btn-primary" id="guardarPacienteBtn" style="background: #27ae60;">Guardar Paciente</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/recepcion-pacientes.js"></script>
</body>
</html>
