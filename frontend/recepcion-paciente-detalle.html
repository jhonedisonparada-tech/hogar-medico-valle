<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Paciente | Recepción - Hogar Médico del Valle</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.4.0/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/recepcion.css">
</head>
<body>
    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div class="logo-container">
            <img src="img/logo.png" alt="Hogar Médico del Valle" class="logo">
            <div class="logo-text">
                <strong>Hogar Médico</strong>
                del Valle
            </div>
        </div>
        <nav class="nav-menu">
            <a href="recepcion-dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="recepcion-citas.html" class="nav-item">
                <i class="fas fa-calendar-check"></i>
                <span>Citas</span>
            </a>
            <a href="recepcion-pacientes.html" class="nav-item active">
                <i class="fas fa-users"></i>
                <span>Pacientes</span>
            </a>
        </nav>
        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-details">
                <span class="user-name" id="userName">Recepcionista</span>
                <span class="user-role">Recepcionista</span>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn-secondary" onclick="window.location.href='recepcion-pacientes.html'">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <h1 class="page-title" id="tituloPaciente">
                    <i class="fas fa-user"></i>
                    <span id="nombrePacienteTitulo">Cargando...</span>
                </h1>
            </div>
            <div class="header-actions">
                <div class="date-display">
                    <i class="far fa-calendar-alt"></i>
                    <span id="fechaActual"></span>
                </div>
            </div>
        </header>

        <!-- TARJETA DE DATOS PERSONALES -->
        <div class="section-card" id="tarjetaDatosPersonales">
            <div class="section-header">
                <h3><i class="fas fa-address-card"></i> Datos Personales</h3>
                <button class="btn-primary" id="botonEditar" style="background: #3498db;">
                    <i class="fas fa-edit"></i> Editar
                </button>
                <button class="btn-primary" id="botonGuardar" style="background: #27ae60; display: none;">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
                <button class="btn-secondary" id="botonCancelar" style="display: none;">Cancelar</button>
            </div>
            <div class="info-grid">
                <div class="info-item"><span class="info-label">Documento</span><span class="info-value" id="detDocumento">-</span></div>
                <div class="info-item"><span class="info-label">Nombre completo</span><span class="info-value" id="detNombre">-</span></div>
                <div class="info-item"><span class="info-label">Teléfono</span><span class="info-value" id="detTelefono">-</span></div>
                <div class="info-item"><span class="info-label">Email</span><span class="info-value" id="detEmail">-</span></div>
                <div class="info-item"><span class="info-label">Fecha nacimiento</span><span class="info-value" id="detFechaNacimiento">-</span></div>
                <div class="info-item"><span class="info-label">Género</span><span class="info-value" id="detGenero">-</span></div>
                <div class="info-item"><span class="info-label">Dirección</span><span class="info-value" id="detDireccion">-</span></div>
            </div>

            <!-- FORMULARIO DE EDICIÓN (inicialmente oculto) -->
            <div id="formularioEdicion" style="display: none; margin-top: 20px;">
                <form id="formEditarPaciente">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Documento</label>
                            <input type="text" id="editDocumento" required>
                        </div>
                        <div class="form-group">
                            <label>Nombre completo</label>
                            <input type="text" id="editNombre" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="editTelefono">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="editEmail">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha de nacimiento</label>
                            <input type="date" id="editFechaNacimiento">
                        </div>
                        <div class="form-group">
                            <label>Género</label>
                            <select id="editGenero">
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Otro</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="editDireccion">
                    </div>
                </form>
            </div>
        </div>

        <!-- TABLA DE CITAS DEL PACIENTE -->
        <div class="section-card">
            <div class="section-header">
                <h3><i class="fas fa-calendar-check"></i> Historial de Citas</h3>
                <span id="totalCitasPaciente">0 citas</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Médico</th>
                            <th>Especialidad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="citasPacienteBody">
                        <tr><td colspan="5" class="loading-msg"><i class="fas fa-spinner fa-spin"></i> Cargando citas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/recepcion-paciente-detalle.js"></script>
</body>
</html>
