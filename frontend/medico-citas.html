<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas | Hogar Médico del Valle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medico.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo-container">
            <img src="img/logo.png" alt="Hogar Médico del Valle" class="logo">
            <div class="logo-text"><strong>Hogar Médico</strong> del Valle</div>
        </div>
        <nav class="nav-menu">
            <a href="medico-dashboard.html" class="nav-item"><i class="fas fa-home"></i> Inicio</a>
            <a href="medico-paciente.html" class="nav-item"><i class="fas fa-users"></i> Mis Pacientes</a>
            <a href="medico-citas.html" class="nav-item active"><i class="fas fa-calendar-check"></i> Mis Citas</a>
            <a href="medico-historias.html" class="nav-item"><i class="fas fa-notes-medical"></i> Historia Clínica</a>
            <a href="medico-formulas.html" class="nav-item"><i class="fas fa-pills"></i> Medicamentos</a>
            <a href="medico-paraclinicos.html" class="nav-item"><i class="fas fa-flask"></i> Paraclínicos</a>
            <a href="medico-incapacidades.html" class="nav-item"><i class="fas fa-file-medical"></i> Incapacidades</a>
        </nav>
        <div class="user-info">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <div>
                <span class="user-name" id="userName">Dr. Miguel Sánchez</span>
                <span class="user-role">Médico</span>
            </div>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <main class="main-content">
        <header class="header">
            <h1 class="page-title"><i class="fas fa-calendar-check"></i> Mis Citas</h1>
            <div class="header-actions">
                <div class="date-display"><i class="far fa-calendar-alt"></i> <span id="fechaActual"></span></div>
            </div>
        </header>

        <!-- Filtros rápidos -->
        <div class="filtros-rapidos">
            <button class="filtro-btn active" data-filtro="hoy">Hoy</button>
            <button class="filtro-btn" data-filtro="manana">Mañana</button>
            <button class="filtro-btn" data-filtro="semana">Esta semana</button>
            <button class="filtro-btn" data-filtro="pendientes">Pendientes</button>
            <button class="filtro-btn" data-filtro="todas">Todas</button>
            <span class="total-citas" id="totalCitas">0 citas</span>
        </div>

        <!-- Tabla de citas -->
        <div class="table-container">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Documento</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="citasBody">
                        <tr><td colspan="7" class="loading-message"><i class="fas fa-spinner fa-spin"></i> Cargando citas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
<script src="js/medico-citas.js"></script>
</body>
</html>
