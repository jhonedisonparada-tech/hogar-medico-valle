    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Panel Médico | Hogar Médico del Valle</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/medico.css">
    </head>
    <body>
        <div class="sidebar">
            <div class="logo-container">
                <img src="img/logo.png" alt="Hogar Médico del Valle" class="logo">
                <div class="logo-text"><strong>Hogar Médico</strong> del Valle</div>
            </div>
            <nav class="nav-menu">
                <a href="medico-dashboard.html" class="nav-item active"><i class="fas fa-home"></i> Inicio</a>
                <a href="medico-paciente.html" class="nav-item"><i class="fas fa-users"></i> Mis Pacientes</a>
                <a href="medico-citas.html" class="nav-item"><i class="fas fa-calendar-check"></i> Mis Citas</a>
                <a href="medico-historias.html" class="nav-item"><i class="fas fa-notes-medical"></i> Historia Clínica</a>
                <a href="medico-formulas.html" class="nav-item"><i class="fas fa-pills"></i> Medicamentos</a>
                <a href="medico-paraclinicos.html" class="nav-item"><i class="fas fa-flask"></i> Paraclínicos</a>
                <a href="medico-incapacidades.html" class="nav-item"><i class="fas fa-file-medical"></i> Incapacidades</a>
            </nav>
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                <div>
                    <span class="user-name" id="userName">Dr. Miguel Sánchez</span>
                    <span class="user-role" id="userRole">Médico</span>
                </div>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <main class="main-content">
            <header class="header">
                <h1 class="page-title"><i class="fas fa-user-md"></i> Panel del Médico</h1>
                <div class="header-actions">
                    <div class="date-display"><i class="far fa-calendar-alt"></i> <span id="fechaActual"></span></div>
                    <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
                </div>
            </header>

            <div class="stats-grid">
                <a href="medico-citas.html" class="stat-link">
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#3498db;"><i class="fas fa-calendar-check"></i></div>
                        <div class="stat-details">
                            <span class="stat-label">Citas Hoy</span>
                            <span class="stat-value" id="citasHoy">0</span>
                        </div>
                    </div>
                </a>
                <a href="medico-paciente.html" class="stat-link">
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#2ecc71;"><i class="fas fa-users"></i></div>
                        <div class="stat-details">
                            <span class="stat-label">Pacientes</span>
                            <span class="stat-value" id="totalPacientes">0</span>
                        </div>
                    </div>
                </a>
                <a href="medico-citas.html" class="stat-link">
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#e74c3c;"><i class="fas fa-clock"></i></div>
                        <div class="stat-details">
                            <span class="stat-label">Próximas</span>
                            <span class="stat-value" id="proximasCitas">0</span>
                        </div>
                    </div>
                </a>
                <a href="medico-historias.html" class="stat-link">
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#f39c12;"><i class="fas fa-notes-medical"></i></div>
                        <div class="stat-details">
                            <span class="stat-label">Historias</span>
                            <span class="stat-value" id="totalHistorias">0</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <h3><i class="fas fa-clock"></i> Mis Citas de Hoy</h3>
                    <a href="medico-citas.html" class="btn-view-all">Ver todas <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>Hora</th><th>Paciente</th><th>Documento</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="citasHoyBody">
                            <tr><td colspan="6" class="loading-message"><i class="fas fa-spinner fa-spin"></i> Cargando citas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <script src="js/medico-dashboard.js"></script>
    </body>
    </html>
