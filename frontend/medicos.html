<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos | Hogar Médico del Valle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medicos.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo-container">
            <img src="img/logo.png" alt="Hogar Médico del Valle" class="logo">
            <div class="logo-text">
                <strong>Hogar Médico</strong>
                del Valle
            </div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="pacientes.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Pacientes</span>
            </a>
            <a href="medicos.html" class="nav-item active">
                <i class="fas fa-user-md"></i>
                <span>Médicos</span>
            </a>
            <a href="citas.html" class="nav-item">
                <i class="fas fa-calendar-check"></i>
                <span>Citas</span>
            </a>
            <a href="historias.html" class="nav-item">
                <i class="fas fa-notes-medical"></i>
                <span>Historias</span>
            </a>
            <a href="configuracion.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Configuración</span>
            </a>
        </nav>
        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="user-details">
                <span class="user-name" id="userName">Dr. Juan Pérez</span>
                <span class="user-role" id="userRole">Administrador</span>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <main class="main-content">
        <header class="header">
            <h1 class="page-title">
                <i class="fas fa-user-md"></i>
                Gestión de Médicos
            </h1>
            <div class="header-actions">
                <div class="date-display">
                    <i class="far fa-calendar-alt"></i>
                    <span id="fechaActual"></span>
                </div>
                <button class="btn-primary" id="nuevoMedicoBtn">
                    <i class="fas fa-plus"></i>
                    Nuevo Médico
                </button>
            </div>
        </header>

        <div class="filters-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="buscarMedico" placeholder="Buscar por nombre, documento o especialidad...">
            </div>
            <div class="filter-options">
                <select id="filtroEspecialidad">
                    <option value="todos">Todas las especialidades</option>
                </select>
                <button class="btn-secondary" id="limpiarFiltros">
                    <i class="fas fa-eraser"></i>
                    Limpiar
                </button>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>
                    <i class="fas fa-list"></i>
                    Listado de Médicos
                </h3>
                <span class="table-count" id="totalMedicos">0 médicos</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Documento</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Registro</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="medicosTableBody">
                        <tr>
                            <td colspan="8" class="loading-message">
                                <i class="fas fa-spinner fa-spin"></i>
                                Cargando médicos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL NUEVO/EDITAR MÉDICO -->
    <div class="modal" id="medicoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Médico</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="medicoForm">
                    <input type="hidden" id="medicoId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre completo</label>
                            <input type="text" id="nombre" required>
                        </div>
                        <div class="form-group">
                            <label>Documento</label>
                            <input type="text" id="documento" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Especialidad</label>
                            <select id="especialidad_id" required>
                                <option value="">Seleccione</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Registro Médico</label>
                            <input type="text" id="registro_medico">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="telefono">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Estado</label>
                            <select id="activo">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelarModal">Cancelar</button>
                <button class="btn-primary" id="guardarMedico">Guardar Médico</button>
            </div>
        </div>
    </div>

    <script src="js/medicos.js"></script>
</body>
</html>
